<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>備品ボード</title>
<style>
:root{
  --paper:#f5f7f9; --sheet:#fff; --ink:#1b2430; --muted:#5d6b7a; --line:#dde3ea;
  --blue:#2346b8; --blue-soft:#e6ecfb; --stamp:#c8262e; --stamp-soft:#fbe9e9;
  --amber:#8a5200; --amber-soft:#fdf1dc; --green:#1d7a4c; --green-soft:#e2f4ea;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#12161c; --sheet:#1a2028; --ink:#e7ecf2; --muted:#9aa7b5; --line:#2b333e;
  --blue:#8ea8ff; --blue-soft:#222c48; --stamp:#ff6b6f; --stamp-soft:#3a1e22;
  --amber:#f0b04f; --amber-soft:#3a2c14; --green:#5fd39a; --green-soft:#16332a; color-scheme:dark }}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--sheet);border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:8px;padding:10px 0 2px}
.top h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px}
nav button{flex:1;appearance:none;border:0;background:none;font:inherit;font-size:15px;padding:10px 0;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
main{padding:14px 0 40px;display:flex;flex-direction:column;gap:12px}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:13px;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=search],input[type=text],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
textarea{resize:vertical;min-height:84px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.it .ph{aspect-ratio:1/1;background:var(--paper);display:grid;place-items:center;position:relative}
.it .ph img{width:100%;height:100%;object-fit:contain}
.it .ph img.art{padding:14%;opacity:.85}
.it .out{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:var(--stamp-soft);color:var(--stamp);border-radius:999px;padding:1px 8px}
.it .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.it .nm{font-weight:700;font-size:15px;line-height:1.35}
.it a.go{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--stamp);color:#fff;font-weight:700;border-radius:10px;padding:8px 4px;font-size:14px}
.it a.go.done{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.wide{width:100%;padding:13px;font-size:16px}
.btn[disabled]{opacity:.55}
.msg{font-size:14px;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--stamp-soft);color:var(--stamp)}
.msg.ok{background:var(--green-soft);color:var(--green)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.want h3{font-size:16px;margin:4px 0}
.tag{font-size:12px;border-radius:999px;padding:1px 9px;font-weight:700}
.tag.s0{background:var(--stamp-soft);color:var(--stamp)} .tag.s1{background:var(--amber-soft);color:var(--amber)} .tag.s2{background:var(--green-soft);color:var(--green)}
.reply{margin:8px 0 0 10px;padding:6px 10px;border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0;font-size:14px}
.reply .meta{font-size:12px}
.plan{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:6px;overflow:hidden}
.plan svg{width:100%;height:auto;display:block}
.plan .wall{fill:none;stroke:var(--muted);stroke-width:3}
.plan .fx{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.plan .desk{fill:var(--paper);stroke:var(--line)}
.plan .seat{fill:none;stroke:var(--line)}
.plan .solid{fill:var(--line)}
.plan .step{stroke:var(--line);stroke-width:1.5}
.plan .door{fill:var(--blue)}
.plan .lbl{font-size:14px;fill:var(--muted)} .plan .lbl.big{font-size:17px;font-weight:700}
.plan .zone{fill:var(--stamp);opacity:.35}
.plan .pin{fill:var(--stamp);stroke:#fff;stroke-width:3}
.plan .on .pin{fill:var(--blue)} .plan .on .zone{fill:var(--blue)}
.plan .pt{fill:#fff;font-size:17px;font-weight:700}
.plan .hit{fill:transparent;cursor:pointer}
@media (max-width:560px){ .plan .pin{r:34} .plan .pt{font-size:34px;transform:translateY(6px);transform-box:fill-box} .plan .lbl{display:none} .plan .lbl.big{display:block;font-size:28px} }
.empty{text-align:center;color:var(--muted);padding:24px 0}
.scene{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
@media (prefers-color-scheme:dark){ .scene,.it .ph img.art{opacity:.8} }
</style>
<link rel="icon" href="icon-32.png">
<link rel="stylesheet" href="theme.css">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><img class="brandIcon" src="icon-180.png" alt=""><h1 class="brand">備品ボード<small>なくなったら、すぐ伝わる。</small></h1></div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"><div class="empty">読み込んでいます…</div></main>
<script src="config.js"></script>
<script src="version.js"></script>
<script src="verbar.js" defer></script>
<script>
(function () {
  var API = window.BIHIN_API || '';
  var q = new URLSearchParams(location.hash.slice(1) || location.search);
  var key = q.get('k') || '';
  var app = document.getElementById('app');
  var S = { tab: q.get('tab') || 'list', items: null, spots: [], cat: 'すべて', spot: '', text: '', map: null, mapSpot: 'C', wants: null };
  try { var t = localStorage.getItem('bihin.list.tab'); if (t && !q.get('tab') && t !== 'want') S.tab = t; } catch (e) {}

  function el(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (function add(xs) { for (var i = 0; i < xs.length; i++) { var c = xs[i]; if (Array.isArray(c)) add(c); else if (c != null && c !== false) e.append(c); } })([].slice.call(arguments, 2));
    return e;
  }
  function show() { app.replaceChildren.apply(app, Array.prototype.filter.call(arguments, Boolean)); }
  function fmt(iso) { var d = new Date(iso); if (isNaN(d)) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function catArt(it) {
    var s = (it.category || '') + ' ' + (it.name || '');
    if (/封筒/.test(s)) return 'img/cat-envelope.webp';
    if (/電池/.test(s)) return 'img/cat-battery.webp';
    if (/筆記|ペン|マーカー|鉛筆|修正/.test(s)) return 'img/cat-pen.webp';
    if (/ファイル/.test(s)) return 'img/cat-file.webp';
    if (/とじ|ホッチキス|クリップ/.test(s)) return 'img/cat-binding.webp';
    if (/梱包|テープ/.test(s)) return 'img/cat-pack.webp';
    if (/紙|付箋|用紙/.test(s)) return 'img/cat-paper.webp';
    return 'img/cat-other.webp';
  }
  function get(params) {
    params.k = key;
    return fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(params).toString(), { redirect: 'follow' }).then(function (r) { return r.json(); });
  }
  function post(body) {
    body.k = key;
    return fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function trouble(r) {
    var bad = r && r.error === 'key';
    show(el('img', { src: 'img/trouble.webp', alt: '', class: 'scene' }),
      el('div', { class: 'msg err', text: bad ? 'このQRコードは使えなくなっています。管理部に伝えてください。' : '読み込めませんでした。電波の良い所でもう一度開いてください。' }));
  }

  /* ---------- 骨組み ---------- */
  /* タブは「一覧」「マップ」の2つ。ほしい！はタブにせず、ページの下の小さな入口から開く（2026-11-15 木村さん） */
  var TABS = [['list', '一覧'], ['map', 'マップ']];
  /* 管理用・報告の画面から来た時は、題の横に「← 戻る」を出す（ホーム画面のアプリやスマホでは、ブラウザの戻るが見えないことがあるため） */
  (function () {
    var b = null;
    try { b = JSON.parse(sessionStorage.getItem('bihin.back') || 'null'); } catch (e) {}
    if (!b || !b.url) return;
    var top = document.querySelector('.top');
    var btn = el('button', { class: 'btn', type: 'button', text: '← ' + (b.label || '戻る'), style: 'margin-left:auto;padding:6px 10px;font-size:13px' });
    btn.onclick = function () { try { sessionStorage.removeItem('bihin.back'); } catch (e) {} location.href = b.url; };
    top.append(btn);
  })();
  function go(tab) { S.tab = tab; if (tab !== 'want') { try { localStorage.setItem('bihin.list.tab', tab); } catch (e) {} } render(); window.scrollTo(0, 0); }
  function render() {
    var nav = document.getElementById('tabs');
    nav.replaceChildren.apply(nav, TABS.map(function (t) {
      return el('button', { type: 'button', role: 'tab', 'aria-selected': String(S.tab === t[0]), text: t[1], onclick: function () { go(t[0]); } });
    }));
    if (S.tab === 'map') mapView(); else if (S.tab === 'want') wantView(); else listView();
  }
  function wantLink() {
    return el('div', { class: 'card', style: 'display:flex;gap:10px;align-items:center;margin-top:8px' },
      el('div', { style: 'flex:1' }, el('div', { text: 'ほかに欲しい物がある時は', style: 'font-weight:700;font-size:14px' }), el('div', { class: 'meta', text: '置いてほしい物・新しく欲しい物を、一言で管理部に頼めます。' })),
      el('button', { class: 'btn', type: 'button', text: 'ほしい！を伝える', onclick: function () { go('want'); } }));
  }
  /* 前回の一覧を端末に控えておき、開いた時にすぐ出して、裏で新しくする（GAS の返事待ちの重さを減らす） */
  function cGet(k) { try { return JSON.parse(localStorage.getItem('bihin.c.' + k) || 'null'); } catch (e) { return null; } }
  function cSet(k, v) { try { localStorage.setItem('bihin.c.' + k, JSON.stringify(v)); } catch (e) {} }
  var refreshed = false;
  function needItems(fn) {
    if (S.items) return fn();
    var c = cGet('list');
    if (c) { S.items = c.items; S.spots = c.spots; fn(); }
    else show(el('div', { class: 'empty', text: '読み込んでいます…' }));
    if (refreshed) return;
    refreshed = true;
    get({ action: 'list' }).then(function (r) {
      if (!r || !r.ok) { if (!c) trouble(r); return; }
      cSet('list', { items: r.items, spots: r.spots });
      S.items = r.items; S.spots = r.spots;
      var a = document.activeElement;
      if (c && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;   // 入力中は描き直さない
      fn();
    }).catch(function () { if (!c) trouble(null); });
  }

  /* ---------- 写真（見えた物から順に読む） ---------- */
  var photoCache = {};
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); loadPhoto(e.target); } });
  }, { rootMargin: '200px' }) : null;
  function loadPhoto(img) {
    var code = img.dataset.code;
    if (photoCache[code]) { img.src = photoCache[code]; img.className = ''; return; }
    get({ action: 'photo', i: code }).then(function (r) {
      if (r && r.ok && r.photo) { photoCache[code] = r.photo; img.src = r.photo; img.className = ''; }
    }).catch(function () {});
  }

  function card(it) {
    var pic = el('img', { src: catArt(it), alt: '', class: 'art', loading: 'lazy' });
    if (it.hasPhoto) { pic.dataset.code = it.code; if (io) io.observe(pic); else loadPhoto(pic); }
    var url = './#i=' + encodeURIComponent(it.code) + '&k=' + encodeURIComponent(key);
    // 前の作りと同じカード：左下に備品コードの札、在庫切れは写真を灰色に薄くして左上に「● 在庫切れ」、置き場所の横に「図で見る」
    var toMap = it.spot ? el('button', { class: 'maplink', type: 'button', text: '図で見る', onclick: function () { S.mapSpot = it.spot; go('map'); } }) : null;
    return el('div', { class: 'it' + (it.out ? ' out' : '') },
      el('div', { class: 'ph' }, pic, el('span', { class: 'code', text: it.code }), it.out && el('span', { class: 'stamp', text: '在庫切れ' })),
      el('div', { class: 'bd' },
        el('div', { class: 'nm', text: it.name }),
        it.spec && el('div', { class: 'meta', text: it.spec }),
        el('div', { class: 'meta' }, '置き場所：' + (it.place || '—') + ' ', toMap),
        el('a', { class: 'go' + (it.out ? ' done' : ''), href: url, text: it.out ? '報告済み（わたしも無かった）' : 'なくなりました' })));
  }

  /* ---------- 一覧 ---------- */
  function listView() {
    needItems(function () {
      var cats = ['すべて'].concat(Array.from(new Set(S.items.map(function (i) { return i.category; }).filter(Boolean))));
      var catChips = el('div', { class: 'chips' }, cats.map(function (c) {
        return el('button', { class: 'chip', type: 'button', 'aria-pressed': String(S.cat === c), text: c, onclick: function () { S.cat = c; listView(); } });
      }));
      var spotChips = el('div', { class: 'chips' }, [el('button', { class: 'chip', type: 'button', 'aria-pressed': String(!S.spot), text: '置き場所：すべて', onclick: function () { S.spot = ''; listView(); } })].concat(S.spots.map(function (s) {
        return el('button', { class: 'chip', type: 'button', 'aria-pressed': String(S.spot === s.id), text: s.id + '．' + s.name, onclick: function () { S.spot = s.id; listView(); } });
      })));
      var search = el('input', { type: 'search', placeholder: '名前で探す', value: S.text, 'aria-label': '名前で探す' });
      var grid = el('div', { class: 'grid' });
      function fill() {
        var k = S.text.trim().toLowerCase();
        var xs = S.items.filter(function (i) {
          return (S.cat === 'すべて' || i.category === S.cat) && (!S.spot || i.spot === S.spot) && (!k || (i.name + ' ' + i.code).toLowerCase().indexOf(k) >= 0);
        });
        grid.replaceChildren.apply(grid, xs.length ? xs.map(card) : [el('div', { class: 'empty', text: '当てはまる備品はありません。' })]);
      }
      search.oninput = function () { S.text = search.value; fill(); };
      fill();
      var outs = S.items.filter(function (i) { return i.out; }).length;
      show(search, catChips, spotChips, outs ? el('div', { class: 'meta', text: '在庫切れの報告が出ている備品：' + outs + '件' }) : null, grid, wantLink());
    });
  }

  /* ---------- マップ ---------- */
  function mapView() {
    needItems(function () {
      if (S.map) return drawMap();
      var c = cGet('map');
      if (c) { S.map = c; drawMap(); }   // 配置図はほとんど変わらないので、控えがあればすぐ出す
      else show(el('div', { class: 'empty', text: 'マップを読み込んでいます…' }));
      if (S.mapLoading) return;
      S.mapLoading = true;
      get({ action: 'map' }).then(function (r) {
        if (!r || !r.ok) { if (!c) trouble(r); return; }
        cSet('map', { svg: r.svg, viewBox: r.viewBox, spots: r.spots });
        S.map = r; if (S.tab === 'map') drawMap();
      }).catch(function () { if (!c) trouble(null); });
    });
  }
  function drawMap() {
    var m = S.map, NS = 'http://www.w3.org/2000/svg';
    var plan = el('div', { class: 'plan' });
    plan.innerHTML = '<svg viewBox="' + m.viewBox + '" role="img" aria-label="事務所の配置図。赤い印が備品の置き場所">' + m.svg + '</svg>';
    var svg = plan.firstChild;
    m.spots.forEach(function (s) {
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', S.mapSpot === s.id ? 'on' : '');
      g.setAttribute('role', 'button'); g.setAttribute('tabindex', '0'); g.setAttribute('aria-label', '置き場所 ' + s.id + ' ' + s.name);
      var z = s.zone, p = s.pin;
      var x0 = Math.min(z[0], p[0] - 26) - 6, y0 = Math.min(z[1], p[1] - 26) - 6;
      var x1 = Math.max(z[0] + z[2], p[0] + 26) + 6, y1 = Math.max(z[1] + z[3], p[1] + 26) + 6;
      g.innerHTML = '<rect class="hit" x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '"/>' +
        '<rect class="zone" x="' + z[0] + '" y="' + z[1] + '" width="' + z[2] + '" height="' + z[3] + '"/>' +
        '<circle class="pin" cx="' + p[0] + '" cy="' + p[1] + '" r="16"/>' +
        '<text class="pt" x="' + p[0] + '" y="' + (p[1] + 6) + '" text-anchor="middle">' + s.id + '</text>';
      var go = function () { S.mapSpot = s.id; drawMap(); };
      g.addEventListener('click', go);
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      svg.appendChild(g);
    });
    var cur = m.spots.find(function (s) { return s.id === S.mapSpot; }) || m.spots[0];
    var here = S.items.filter(function (i) { return i.spot === cur.id; });
    var spotBtns = el('div', { class: 'chips' }, m.spots.map(function (s) {
      var n = S.items.filter(function (i) { return i.spot === s.id; }).length;
      return el('button', { class: 'chip', type: 'button', 'aria-pressed': String(s.id === cur.id), text: s.id + '．' + s.name + '（' + n + '）', onclick: function () { S.mapSpot = s.id; drawMap(); } });
    }));
    // PC では図面（左）と、その場所の備品（右）を並べる（theme.css の .split）。スマホでは上下
    show(el('div', { class: 'meta', text: '赤い印を押すと、そこにある備品が出ます。' }),
      el('div', { class: 'split' },
        el('div', { class: 'mainp' }, plan, spotBtns),
        el('div', { class: 'side' },
          el('h2', { text: cur.id + '．' + cur.name, style: 'font-size:17px;margin:4px 0 0' }),
          here.length ? el('div', { class: 'grid' }, here.map(card)) : el('div', { class: 'empty', text: 'この置き場所の備品は、まだ登録されていません。' }))),
      wantLink());
  }

  /* ---------- ほしい！ ---------- */
  function wantView(flash) {
    needItems(function () {
      var text = el('textarea', { id: 'wtext', maxlength: '200', placeholder: '例：A4の封筒（角2）を置いてほしい／付箋の大きいサイズがほしい' });
      var name = el('input', { type: 'text', id: 'wname', maxlength: '20', placeholder: '空でもよい', autocomplete: 'name' });
      var sel = el('select', { id: 'witem' }, el('option', { value: '', text: '（選ばなくてよい）' }), S.items.map(function (i) { return el('option', { value: i.code, text: i.name }); }));
      try { text.value = localStorage.getItem('bihin.want.draft') || ''; name.value = localStorage.getItem('bihin.want.name') || ''; } catch (e) {}
      text.oninput = function () { try { localStorage.setItem('bihin.want.draft', text.value); } catch (e) {} };
      var msg = el('div');
      var send = el('button', { class: 'btn primary wide', type: 'submit', text: '管理部に送る' });
      var form = el('form', { class: 'card' },
        el('h2', { text: 'ほしい物を伝える', style: 'font-size:17px;margin:0' }),
        el('div', { class: 'meta', text: '無くなった物・置いてほしい物を、一言で管理部に頼めます。ここに書いた内容と返事は、このQRを読んだ人みんなが見られます。人の名前や社外のことは書かないでください。' }),
        el('label', { for: 'wtext', text: 'ほしい物（200字まで）' }), text,
        el('label', { for: 'wname', text: 'あなたの名前（任意）' }), name,
        el('label', { for: 'witem', text: '関係する備品（任意）' }), sel,
        el('div', { style: 'height:12px' }), msg, el('div', { style: 'height:6px' }), send);
      form.onsubmit = function (e) {
        e.preventDefault();
        if (!text.value.trim()) { msg.className = 'msg err'; msg.textContent = 'ほしい物を書いてください。'; return; }
        send.disabled = true; send.textContent = '送っています…';
        post({ action: 'want', text: text.value, name: name.value, item: sel.value }).then(function (r) {
          if (!r || !r.ok) {
            send.disabled = false; send.textContent = '管理部に送る'; msg.className = 'msg err';
            msg.textContent = r && r.error === 'too_long' ? '200字までにしてください。' : r && r.error === 'busy' ? '混み合っています。少し待ってから送ってください。' : '送れませんでした。電波の良い所でもう一度送ってください。';
            return;
          }
          try { localStorage.removeItem('bihin.want.draft'); localStorage.setItem('bihin.want.name', name.value); } catch (e2) {}
          S.wants = null;
          wantView(el('div', { class: 'msg ok', text: '管理部に届きました。返事はこのページに出ます。' }));
        }).catch(function () { send.disabled = false; send.textContent = '管理部に送る'; msg.className = 'msg err'; msg.textContent = '送れませんでした。電波の良い所でもう一度送ってください。'; });
      };
      var list = el('div', { style: 'display:flex;flex-direction:column;gap:10px' }, el('div', { class: 'empty', text: 'リクエストを読み込んでいます…' }));
      show(el('button', { class: 'btn', type: 'button', text: '← 一覧へ戻る', style: 'align-self:flex-start;padding:6px 12px;font-size:14px', onclick: function () { go('list'); } }),
        flash, form, el('h2', { text: '出ているリクエスト', style: 'font-size:17px;margin:8px 0 0' }), list);
      var draw = function () {
        if (!S.wants.length) return list.replaceChildren(el('div', { class: 'empty', text: 'いま出ているリクエストはありません。' }));
        list.replaceChildren.apply(list, S.wants.map(wantCard));
      };
      if (S.wants) draw();
      else get({ action: 'wants' }).then(function (r) { if (!r || !r.ok) return list.replaceChildren(el('div', { class: 'msg err', text: '読み込めませんでした。' })); S.wants = r.wants; draw(); }).catch(function () {});
    });
  }
  function wantCard(w) {
    var cls = w.state === '完了' ? 's2' : w.state === '対応中' ? 's1' : 's0';
    return el('div', { class: 'card want' },
      el('div', { style: 'display:flex;gap:8px;align-items:center' }, el('span', { class: 'tag ' + cls, text: w.state }), el('span', { class: 'meta', text: fmt(w.at) + (w.name ? '・' + w.name : '') + (w.itemName ? '・' + w.itemName : '') })),
      el('h3', { text: w.text }),
      w.replies.map(function (r) { return el('div', { class: 'reply' }, el('div', { text: r.text }), el('div', { class: 'meta', text: '管理部（' + r.by + '）・' + fmt(r.at) })); }));
  }

  if (!key) { show(el('img', { src: 'img/scan.webp', alt: '', class: 'scene' }), el('div', { class: 'meta', style: 'text-align:center', text: '棚の近くに貼ってある「ほしい！・備品の一覧」のQRコードを、スマホのカメラで読んで開いてください。' })); return; }
  if (!API || API.indexOf('REPLACE_WITH') >= 0) { show(el('div', { class: 'msg err', text: '設定がまだです（config.js）。' })); return; }
  render();
})();
</script>
</body>
</html>
