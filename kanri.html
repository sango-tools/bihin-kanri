<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>備品ボード 管理</title>
<style>
:root{
  --paper:#f5f7f9; --sheet:#fff; --ink:#1b2430; --muted:#5d6b7a; --line:#dde3ea;
  --blue:#2346b8; --blue-soft:#e6ecfb; --stamp:#c8262e; --stamp-soft:#fbe9e9;
  --amber:#8a5200; --amber-soft:#fdf1dc; --green:#1d7a4c; --green-soft:#e2f4ea;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#12161c; --sheet:#1a2028; --ink:#e7ecf2; --muted:#9aa7b5; --line:#2b333e;
  --blue:#8ea8ff; --blue-soft:#222c48; --stamp:#ff6b6f; --stamp-soft:#3a1e22;
  --amber:#f0b04f; --amber-soft:#3a2c14; --green:#5fd39a; --green-soft:#16332a; color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--sheet);border-bottom:1px solid var(--line)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
html,body{overflow-x:hidden}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:10px 0 4px}
.top h1{font-size:17px;margin:0;flex:1 1 auto;min-width:0}
.who{order:3;flex-basis:100%;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:4px}
nav button{flex:1;appearance:none;border:0;background:none;font:inherit;font-size:15px;padding:10px 0;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
main{padding:16px 0 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=search]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
.btn{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.done{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.wide{width:100%;padding:14px;font-size:17px}
.btn.small{padding:6px 10px;font-size:13px}
.btn{white-space:nowrap;flex:none}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stamp);margin-left:4px;vertical-align:2px}
.ndot[hidden]{display:none}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.qrtag{background:#fff;color:#1b2430;border:1px solid #c9d1db;border-radius:8px;padding:8px;display:flex;gap:10px;align-items:center;break-inside:avoid}
.qrtag .qr{width:96px;height:96px;flex:none}.qrtag .qr img,.qrtag .qr canvas{width:96px!important;height:96px!important}
.qrtag .nm{font-size:16px;font-weight:700;line-height:1.3}.qrtag .meta{color:#5d6b7a;font-size:11px}
@media print{ header,.noprint{display:none!important} body{background:#fff} main{padding:0} }
.row input{flex:1;min-width:0}
.btn[disabled]{opacity:.55}
.msg{font-size:14px;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--stamp-soft);color:var(--stamp)}
.msg.ok{background:var(--green-soft);color:var(--green)}
.meta{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700}
.tag.open{background:var(--stamp-soft);color:var(--stamp)}
.tag.doing{background:var(--amber-soft);color:var(--amber)}
.tag.has{background:var(--green-soft);color:var(--green)}
.tag.none{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.kout{background:var(--stamp);color:#fff}
.tag.kreq{background:var(--blue);color:#fff}
.chip{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:13px;border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.chip .cn{font-size:11px;margin-left:5px;color:var(--muted)}
.plan{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:6px;overflow:hidden}
.plan svg{width:100%;height:auto;display:block}
.plan .wall{fill:none;stroke:var(--muted);stroke-width:3}
.plan .fx,.plan .desk{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.plan .seat{fill:none;stroke:var(--line)}
.plan .solid{fill:var(--line)}
.plan .step{stroke:var(--line);stroke-width:1.5}
.plan .door{fill:var(--blue)}
.plan .lbl{font-size:16px;fill:var(--muted)} .plan .lbl.big{font-size:22px;font-weight:700}
.plan .hit{fill:transparent;cursor:pointer}
.plan .pin{stroke:#fff;stroke-width:4}
.plan .pt{fill:#fff;font-size:30px;font-weight:700}
.plan .zone{opacity:.4}
.plan .mk.out .pin,.plan .mk.out .zone{fill:var(--stamp)}
.plan .mk.soon .pin,.plan .mk.soon .zone{fill:#d08a1e}
.plan .mk.ok .pin,.plan .mk.ok .zone{fill:#8d99a8}
.plan .cnt{fill:#fff;stroke:var(--stamp);stroke-width:4}
.plan .ct{fill:var(--stamp);font-size:22px;font-weight:700}
@media (max-width:560px){ .plan .lbl{display:none} .plan .lbl.big{display:block;font-size:28px}
  .plan .pin{r:40} .plan .pt{font-size:40px;transform:translateY(4px);transform-box:fill-box} .plan .cnt{r:24} .plan .ct{font-size:28px} }
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.dot.out{background:var(--stamp)} .dot.soon{background:#d08a1e} .dot.ok{background:#8d99a8}
select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
.rep h2{font-size:17px;margin:4px 0 2px}
.rep .ops{display:flex;gap:8px;margin-top:10px}
.rep .ops .btn{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item .nm{flex:1;font-weight:700}
.ph{width:100%;aspect-ratio:1/1;max-width:300px;margin:0 auto;border-radius:12px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph span{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.scene{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.head-art{width:calc(100% + 28px);margin:-14px -14px 4px;height:110px;object-fit:cover;object-position:right center;border-radius:14px 14px 0 0;display:block}
.item .th{width:44px;height:44px;flex:none;border-radius:8px;background:var(--paper);object-fit:contain;padding:4px}
.ph.art img{object-fit:contain;padding:10%;opacity:.85}
.guide{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);background:var(--paper);border-radius:10px;padding:8px}
.guide img{width:110px;height:auto;flex:none;border-radius:8px}
@media (prefers-color-scheme:dark){ .scene,.head-art,.ph.art img,.guide img,.item .th{opacity:.85} }
</style>
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header id="hd" hidden>
  <div class="wrap">
    <div class="top"><h1>備品ボード 管理</h1><span class="who" id="who"></span><button class="btn small" id="news" type="button" aria-label="お知らせ">お知らせ<span id="newsDot" class="ndot" hidden></span></button><button class="btn small" id="out" type="button">ログアウト</button></div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"><div class="empty">読み込んでいます…</div></main>
<script src="config.js"></script>
<script src="version.js"></script>
<script src="verbar.js" defer></script>
<script>
(function () {
  var API = window.BIHIN_API || '';
  var KEY = 'bihin.session';
  var app = document.getElementById('app');
  var S = { sess: null, tab: null, items: [], q: '', adminItems: null, spots: [], tasks: [] };

  function el(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (function add(xs) { for (var i = 0; i < xs.length; i++) { var c = xs[i]; if (Array.isArray(c)) add(c); else if (c != null && c !== false) e.append(c); } })([].slice.call(arguments, 2));
    return e;
  }
  function show() { app.replaceChildren.apply(app, Array.prototype.filter.call(arguments, Boolean)); }
  function pic(src, cls) { return el('img', { src: src, alt: '', class: cls || null, decoding: 'async' }); }
  /* 写真が無い備品の絵（index.html と同じ決め方） */
  function catArt(it) {
    var s = (it.category || '') + ' ' + (it.name || '');
    if (/封筒/.test(s)) return 'img/cat-envelope.webp';
    if (/電池/.test(s)) return 'img/cat-battery.webp';
    if (/筆記|ペン|マーカー|鉛筆|修正/.test(s)) return 'img/cat-pen.webp';
    if (/ファイル/.test(s)) return 'img/cat-file.webp';
    if (/とじ|ホッチキス|クリップ/.test(s)) return 'img/cat-binding.webp';
    if (/梱包|テープ/.test(s)) return 'img/cat-pack.webp';
    if (/紙|付箋|用紙/.test(s)) return 'img/cat-paper.webp';
    return 'img/cat-other.webp';
  }
  function fmt(iso) { var d = new Date(iso); if (isNaN(d)) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function loadSess() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.exp > Date.now()) return s; } catch (e) {} return null; }
  function saveSess(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function clearSess() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function call(body) {
    var ctl = 'AbortController' in window ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
    if (S.sess) body.t = S.sess.token;
    return fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r && r.error === 'auth') { logout(true); throw { handled: true }; } return r; })
      .finally(function () { clearTimeout(timer); });
  }
  var ERR = { login: 'ID かパスワードが違います。', locked: '続けて間違えたため、15分止めています。時間をおいて試してください。', role: 'この役割ではできない操作です。',
    too_large: '写真が大き過ぎます。', input: '入力を確かめてください。', config: '報告ページのURLがスプレッドシートに設定されていません。', photo: '写真を読めませんでした。別の写真で試してください。', unknown: '見つかりませんでした。一覧を読み直してください。', busy: '混み合っています。もう一度押してください。' };
  function errText(r) {
    if (r && ERR[r.error]) return ERR[r.error];
    // 原因を追えるよう、短い言葉だけ添える（中身は GAS の「エラー記録」シートに残る）
    var code = r && r.error ? r.error : 'net';   // net＝返事が届かなかった・読めなかった
    return 'うまくいきませんでした。電波の良い所でもう一度試してください。（' + code + '）';
  }

  /* ---------- ログイン ---------- */
  function loginView(note) {
    document.getElementById('hd').hidden = true;
    var id = el('input', { type: 'text', id: 'uid', autocomplete: 'username', autocapitalize: 'off', spellcheck: 'false' });
    var pw = el('input', { type: 'password', id: 'upw', autocomplete: 'current-password' });
    var msg = el('div');
    var go = el('button', { class: 'btn primary wide', type: 'submit', text: 'ログイン' });
    var form = el('form', { class: 'card' },
      pic('img/head-kanri.webp', 'head-art'),
      pic('img/login.webp', 'scene'),
      el('h1', { text: '備品ボード 管理', style: 'font-size:20px;margin:0 0 4px' }),
      el('div', { class: 'meta', text: '写真係・管理部の人だけが使うページです。ID とパスワードは管理している人から受け取ってください。' }),
      el('label', { for: 'uid', text: 'ID' }), id,
      el('label', { for: 'upw', text: 'パスワード' }), pw,
      el('div', { style: 'height:12px' }), msg, el('div', { style: 'height:8px' }), go);
    form.onsubmit = function (e) {
      e.preventDefault();
      if (!id.value.trim() || !pw.value) { msg.className = 'msg err'; msg.textContent = 'ID とパスワードを入れてください。'; return; }
      go.disabled = true; go.textContent = '確かめています…'; msg.className = ''; msg.textContent = '';
      call({ action: 'login', id: id.value.trim(), pw: pw.value }).then(function (r) {
        if (!r.ok) { msg.className = 'msg err'; msg.textContent = errText(r); go.disabled = false; go.textContent = 'ログイン'; return; }
        S.sess = { token: r.token, user: r.user, exp: Date.now() + (r.expiresIn - 60) * 1000 };
        saveSess(S.sess); pw.value = ''; start();
      }).catch(function () { msg.className = 'msg err'; msg.textContent = errText(null); go.disabled = false; go.textContent = 'ログイン'; });
    };
    show(note ? el('div', { class: 'msg err', text: note }) : null, form);
    id.focus();
  }

  function logout(expired) {
    if (S.sess && !expired) call({ action: 'logout' }).catch(function () {});
    S.sess = null; clearSess();
    loginView(expired ? 'ログインの期限が切れました。もう一度ログインしてください。' : null);
  }
  document.getElementById('out').onclick = function () { logout(false); };

  /* ---------- お知らせ（現場ナビと同じ。version.js の BIHIN_NEWS。読んでいない分があればボタンに印） ---------- */
  var NEWS = window.BIHIN_NEWS || [];
  function newsKey(n) { return n.date + '|' + n.text.slice(0, 20); }
  function unreadNews() {
    var seen = {};
    try { (JSON.parse(localStorage.getItem('bihin.news.seen') || '[]')).forEach(function (k) { seen[k] = 1; }); } catch (e) {}
    return NEWS.filter(function (n) { return !seen[newsKey(n)]; });
  }
  function markNewsRead() { try { localStorage.setItem('bihin.news.seen', JSON.stringify(NEWS.map(newsKey))); } catch (e) {} }
  function drawNewsDot() { document.getElementById('newsDot').hidden = !unreadNews().length; }
  document.getElementById('news').onclick = function () { newsView('feature'); };
  function newsView(type) {
    var unread = unreadNews();
    var cnt = function (t) { return unread.filter(function (n) { return n.type === t; }).length; };
    var tabs = el('div', { class: 'row', style: 'gap:6px' }, [['feature', '新しい機能'], ['fix', '直したこと']].map(function (t) {
      return el('button', { class: 'chip' + (type === t[0] ? ' on' : ''), type: 'button', onclick: function () { newsView(t[0]); } }, t[1], cnt(t[0]) ? el('span', { class: 'cn', text: '新 ' + cnt(t[0]) }) : null);
    }));
    var isNew = {}; unread.forEach(function (n) { isNew[newsKey(n)] = 1; });
    var xs = NEWS.filter(function (n) { return n.type === type; });
    show(el('div', { class: 'row' }, el('button', { class: 'btn small', type: 'button', text: '← 戻る', onclick: function () { markNewsRead(); drawNewsDot(); start(); } }),
        el('span', { class: 'meta', style: 'margin-left:auto', text: '画面 v' + (window.BIHIN_VERSION || '?') })),
      el('h2', { text: 'お知らせ', style: 'font-size:18px;margin:0' }), tabs,
      xs.length ? el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, xs.map(function (n) {
        return el('div', { class: 'card' }, el('div', { class: 'row' }, el('span', { class: 'meta', text: n.date }), isNew[newsKey(n)] ? el('span', { class: 'tag open', text: '新しい' }) : null), el('div', { text: n.text, style: 'margin-top:4px' }));
      })) : el('div', { class: 'empty', text: 'まだありません。' }));
    markNewsRead(); drawNewsDot();
  }

  /* ---------- 骨組み ---------- */
  function start() {
    var u = S.sess.user;
    var tabs = u.role === '管理部' ? [['tasks', '連絡'], ['spots', '置き場所'], ['items', '備品'], ['photos', '写真']] : [['photos', '写真']];
    if (!S.tab || !tabs.some(function (t) { return t[0] === S.tab; })) S.tab = tabs[0][0];
    document.getElementById('hd').hidden = false;
    document.getElementById('who').textContent = u.name + '（' + u.role + '）';
    drawNewsDot();
    var nav = document.getElementById('tabs');
    nav.replaceChildren.apply(nav, tabs.map(function (t) {
      return el('button', { type: 'button', role: 'tab', 'aria-selected': String(S.tab === t[0]), text: t[1], onclick: function () { S.tab = t[0]; start(); } });
    }));
    if (S.tab === 'tasks') tasksView(); else if (S.tab === 'spots') spotsView(); else if (S.tab === 'items') itemsView(); else photosView();
  }

  /* ---------- 管理部：連絡（在庫切れとほしい！を1つに。見守りの「疑問・気づき一覧」と同じ絞り込み） ---------- */
  function lsGet(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var TF = { kind: lsGet('bihin.t.kind', 'all'), state: 'open', q: '', sort: lsGet('bihin.t.sort', 'new') };
  function tasksView(flash) {
    show(el('div', { class: 'empty', text: '連絡を読み込んでいます…' }));
    call({ action: 'tasks' }).then(function (r) {
      if (!r.ok) return show(el('div', { class: 'msg err', text: errText(r) }));
      S.tasks = r.tasks; drawTasks(flash);
    }).catch(fail);
  }
  function drawTasks(flash) {
    var ts = S.tasks;
    var cnt = function (f) { return ts.filter(f).length; };
    var kinds = [['all', 'すべて', function () { return true; }], ['out', '在庫切れ', function (t) { return t.kind === 'out'; }], ['req', 'ほしい！', function (t) { return t.kind === 'req'; }]];
    var states = [['open', 'まだ', function (t) { return !t.done; }], ['done', '済み', function (t) { return t.done; }], ['all', 'すべて', function () { return true; }]];
    var kf = kinds.find(function (k) { return k[0] === TF.kind; }) || kinds[0];
    var sf = states.find(function (s) { return s[0] === TF.state; }) || states[0];
    function chipRow(label, opts, cur, onPick, base) {
      return el('div', { class: 'row', style: 'gap:6px' }, el('span', { class: 'meta', text: label, style: 'width:30px' }), opts.map(function (o) {
        return el('button', { class: 'chip' + (cur === o[0] ? ' on' : ''), type: 'button', onclick: function () { onPick(o[0]); } },
          o[1], el('span', { class: 'cn', text: String(cnt(function (t) { return base(t) && o[2](t); })) }));
      }));
    }
    var q = el('input', { type: 'search', placeholder: '名前・内容・置き場所で探す', value: TF.q, 'aria-label': '探す' });
    var sort = el('select', { 'aria-label': '並べ方', style: 'width:auto;flex:none' },
      [['new', '新しい順'], ['old', '古い順'], ['spot', '置き場所ごと']].map(function (o) { return el('option', { value: o[0], text: o[1], selected: TF.sort === o[0] }); }));
    var list = el('div', { style: 'display:flex;flex-direction:column;gap:8px' });
    function fill() {
      var k = TF.q.trim().toLowerCase();
      var xs = ts.filter(kf[2]).filter(sf[2]).filter(function (t) { return !k || [t.title, t.name, t.place, t.code, t.itemName].join(' ').toLowerCase().indexOf(k) >= 0; });
      xs.sort(function (a, b) { return TF.sort === 'old' ? a.at.localeCompare(b.at) : b.at.localeCompare(a.at); });
      if (!xs.length) return list.replaceChildren(pic('img/empty-reports.webp', 'scene'), el('div', { class: 'empty', text: '当てはまる連絡はありません。', style: 'padding-top:4px' }));
      if (TF.sort === 'spot') {
        var groups = {};
        xs.forEach(function (t) { var g = t.spot || '—'; (groups[g] = groups[g] || []).push(t); });
        var keys = Object.keys(groups).sort();
        list.replaceChildren.apply(list, keys.map(function (g) {
          var nm = (S.spots.find(function (s) { return s.id === g; }) || {}).name;
          return el('div', {}, el('div', { class: 'meta', style: 'font-weight:700;margin:4px 0', text: g === '—' ? '置き場所なし' : g + '．' + (nm || '') + '（' + groups[g].length + '）' }),

      return loadQrLib().then(function () {
        var tags = (codes ? [] : [{ code: '', name: 'ほしい！・備品の一覧', spec: '無い物を頼む・どこに何があるか', url: r.listUrl, hint: '棚の近くに1枚貼ってください' }])
          .concat(r.items.map(function (x) { x.hint = 'なくなったら読んでください'; return x; }));
        var grid = el('div', { class: 'qrgrid' }, tags.map(function (t) {
          var box = el('div', { class: 'qr' });
          new window.QRCode(box, { text: t.url, width: 256, height: 256, correctLevel: window.QRCode.CorrectLevel.M });
          return el('div', { class: 'qrtag' }, box, el('div', {},
            el('div', { class: 'nm', text: t.name }), el('div', { class: 'meta', text: [t.code, t.spec].filter(Boolean).join('　') }), el('div', { class: 'meta', text: t.hint })));
        }));
        show(el('div', { class: 'row noprint' },
            el('button', { class: 'btn small', type: 'button', text: '← 備品の一覧へ', onclick: function () { itemsView(); } }),
            el('button', { class: 'btn primary', type: 'button', text: '印刷する', onclick: function () { window.print(); } })),
          el('div', { class: 'msg noprint', style: 'background:var(--amber-soft);color:var(--amber)', text: '切り取って、備品の箱・トレイの正面に貼ってください。札には鍵が入っています。社外に出さないでください。' }),
          grid);
      });
    }).catch(fail);
  }
  function loadQrLib() {
    if (window.QRCode) return Promise.resolve();
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = res; s.onerror = rej; document.head.append(s);
    });
  }

  /* ---------- 管理部：報告 ---------- */
  function reportsView(flash) {
    show(el('div', { class: 'empty', text: '報告を読み込んでいます…' }));
    call({ action: 'reports' }).then(function (r) {
      if (!r.ok) return show(el('div', { class: 'msg err', text: errText(r) }));
      var head = el('div', { class: 'row' }, el('div', { class: 'meta', style: 'flex:1', text: '未対応・対応中 ' + r.reports.length + '件（補充済みは出しません）' }),
        el('button', { class: 'btn small', type: 'button', text: '読み直す', onclick: function () { reportsView(); } }));
      if (!r.reports.length) return show(flash, head, pic('img/empty-reports.webp', 'scene'), el('div', { class: 'empty', text: 'いま出ている報告はありません。', style: 'padding-top:4px' }));
      show.apply(null, [flash, head].concat(r.reports.map(repCard)));
    }).catch(function (e) { if (!e || !e.handled) show(el('div', { class: 'msg err', text: errText(null) })); });
  }

  function repCard(x) {
    var doing = x.state === '対応中';
    var ops = el('div', { class: 'ops' });
    function act(state, btn) {
      btn.disabled = true;
      call({ action: 'setState', id: x.id, state: state }).then(function (r) {
        if (!r.ok) { btn.disabled = false; return alert(errText(r)); }
        reportsView(el('div', { class: 'msg ok', text: x.name + ' を「' + state + '」にしました。' }));
      }).catch(function (e) { btn.disabled = false; if (!e || !e.handled) alert(errText(null)); });
    }
    if (!doing) { var b1 = el('button', { class: 'btn', type: 'button', text: '対応中にする' }); b1.onclick = function () { act('対応中', b1); }; ops.append(b1); }
    var b2 = el('button', { class: 'btn done', type: 'button', text: '補充済みにする' }); b2.onclick = function () { act('補充済み', b2); }; ops.append(b2);
    return el('div', { class: 'card rep' },
      el('div', { class: 'row' }, el('span', { class: 'tag ' + (doing ? 'doing' : 'open'), text: x.state }), el('span', { class: 'meta', text: x.code })),
      el('h2', { text: x.name }),
      el('div', { class: 'meta', text: [x.place && '置き場所：' + x.place, fmt(x.since) + ' から・' + x.count + '人', doing && x.by ? '対応：' + x.by : ''].filter(Boolean).join('　') }),
      ops);
  }

  /* ---------- 写真係：写真 ---------- */
  function photosView() {
    show(el('div', { class: 'empty', text: '備品を読み込んでいます…' }));
    call({ action: 'items' }).then(function (r) {
      if (!r.ok) return show(el('div', { class: 'msg err', text: errText(r) }));
      S.items = r.items; drawList();
    }).catch(function (e) { if (!e || !e.handled) show(el('div', { class: 'msg err', text: errText(null) })); });
  }

  function drawList() {
    var q = el('input', { type: 'search', placeholder: '名前・備品コードで絞り込み', value: S.q, 'aria-label': '絞り込み' });
    var list = el('div', { class: 'list' });
    function fill() {
      var k = S.q.trim().toLowerCase();
      var xs = S.items.filter(function (it) { return !k || (it.name + ' ' + it.code).toLowerCase().indexOf(k) >= 0; });
      var none = S.items.filter(function (it) { return !it.hasPhoto; }).length;
      list.replaceChildren.apply(list, [el('div', { class: 'meta', text: '写真が無い備品：' + none + '件' })].concat(xs.map(function (it) {
        return el('button', { class: 'item', type: 'button', onclick: function () { photoView(it); } },
          pic(catArt(it), 'th'),
          el('span', { class: 'nm', text: it.name }), el('span', { class: 'meta', text: it.code }),
          el('span', { class: 'tag ' + (it.hasPhoto ? 'has' : 'none'), text: it.hasPhoto ? '写真あり' : '写真なし' }));
      })));
    }
    q.oninput = function () { S.q = q.value; fill(); };
    fill();
    show(q, list);
  }

  function photoView(it, flash) {
    var ph = it.hasPhoto ? el('div', { class: 'ph' }, el('span', { text: '写真を読み込んでいます…' }))
      : el('div', { class: 'ph art' }, pic(catArt(it)));
    if (it.hasPhoto) call({ action: 'photo', i: it.code }).then(function (r) {
      if (r.ok && r.photo) ph.replaceChildren(el('img', { src: r.photo, alt: '' }));
    }).catch(function () {});
    // capture を付けるとカメラしか開かない端末があるので付けない（カメラ・写真・ファイルを選ぶ画面が出る）
    var file = el('input', { type: 'file', accept: 'image/*', hidden: true });
    var preview = null, msg = el('div');
    var pick = el('button', { class: 'btn wide', type: 'button', text: it.hasPhoto ? 'カメラで撮り直す・写真を選ぶ' : 'カメラで撮る・写真を選ぶ', onclick: function () { file.click(); } });
    var save = el('button', { class: 'btn primary wide', type: 'button', text: 'この写真で登録する', hidden: true });
    file.onchange = function () {
      var f = file.files[0]; if (!f) return;
      msg.className = 'meta'; msg.textContent = '写真を整えています…';
      shrink(f, 640, 0.8).then(function (data) {
        preview = data; ph.replaceChildren(el('img', { src: data, alt: '' }));
        save.hidden = false; msg.textContent = '備品だけが写っているか確かめてから登録してください（人・書類・画面が写り込んだ物は使わない）。';
      }).catch(function () { msg.className = 'msg err'; msg.textContent = '写真を読めませんでした。別の写真で試してください。'; });
    };
    save.onclick = function () {
      if (!preview) return;
      save.disabled = true; save.textContent = '登録しています…';
      call({ action: 'uploadPhoto', i: it.code, data: preview }).then(function (r) {
        if (!r.ok) { save.disabled = false; save.textContent = 'この写真で登録する'; msg.className = 'msg err'; msg.textContent = errText(r); return; }
        it.hasPhoto = true;
        photoView(it, el('div', { class: 'msg ok', text: '登録しました。QR を読むと、この写真が出ます。' }));
      }).catch(function (e) { save.disabled = false; save.textContent = 'この写真で登録する'; if (!e || !e.handled) { msg.className = 'msg err'; msg.textContent = errText(null); } });
    };
    show(flash,
      el('button', { class: 'btn small', type: 'button', text: '← 一覧へ', style: 'align-self:flex-start', onclick: drawList }),
      el('div', { class: 'card' },
        el('div', { class: 'row' }, el('span', { class: 'meta', text: it.code }), el('span', { class: 'tag ' + (it.hasPhoto ? 'has' : 'none'), text: it.hasPhoto ? '写真あり' : '写真なし' })),
        el('h2', { text: it.name, style: 'font-size:19px;margin:4px 0' }),
        el('div', { class: 'meta', text: [it.spec, it.place && '置き場所：' + it.place].filter(Boolean).join('　') }),
        el('div', { style: 'height:10px' }), ph,
        !it.hasPhoto && el('div', { class: 'meta', style: 'text-align:center;margin-top:4px', text: 'まだ写真がありません（絵は分類の目安）' }),
        el('div', { style: 'height:10px' }),
        el('div', { class: 'guide' }, pic('img/photo-guide.webp'), el('span', { text: '備品だけを正面から撮ってください。人・書類・画面は写さない。' })),
        el('div', { style: 'height:8px' }), msg, el('div', { style: 'height:8px' }), pick, el('div', { style: 'height:8px' }), save, file));
  }

  /** 写真を長い辺 max px の JPEG にする（送る量を減らし、位置情報などの付帯情報も落ちる） */
  function shrink(file, max, q) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }

  if (!API || API.indexOf('REPLACE_WITH') >= 0) { show(el('div', { class: 'msg err', text: '設定がまだです（config.js）。' })); return; }
  S.sess = loadSess();
  if (S.sess) start(); else loginView();
})();
</script>
